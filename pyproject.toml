[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-detection"
version = "0.1.0"
description = "Three-class driving-scene object detection for CS4337."
readme = "README.md"
requires-python = ">=3.10,<3.15"
# Allow interpreter-compatible releases; tested exact environment locks follow in D1.
# Pinned YOLOv5 source and weights are acquired separately, outside this package.
dependencies = [
    "torch>=2.5.1,<3",
    "torchvision>=0.20.1,<1",
    "numpy>=1.26.4,<3",
    "Pillow>=9.5.0,<13",
    "opencv-python>=4.10.0.84,<5",
    "PyYAML>=6.0.2,<7",
    "pycocotools>=2.0.10,<3",
    # Imported by pinned YOLOv5 v7.0; no optional trackers/export services.
    "setuptools>=68,<81",
    "gitpython>=3.1,<4",
    "ipython>=8,<10",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "psutil>=5.9,<8",
    "requests>=2.31,<3",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "tensorboard>=2.4.1,<3",
    "thop>=0.1.1,<1",
    "tqdm>=4.66,<5",
]

[project.scripts]
driving-detection = "driving_detection.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

